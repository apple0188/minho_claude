<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face { font-family: P; font-weight: 600; src: url(homepage/fonts/Pretendard-SemiBold.woff2); }
@font-face { font-family: P; font-weight: 800; src: url(homepage/fonts/Pretendard-ExtraBold.woff2); }
html,body{margin:0}
body{width:1200px;height:630px;background:#0F4C45;color:#fff;font-family:P,sans-serif;position:relative;overflow:hidden;word-break:keep-all}
.b1{position:absolute;width:760px;height:760px;right:-260px;top:-300px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,150,58,.35),transparent 70%)}
.b2{position:absolute;width:520px;height:520px;left:-200px;bottom:-300px;border-radius:50%;border:80px solid rgba(255,255,255,.05)}
.in{position:absolute;left:84px;top:78px;right:84px}
.logo{display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px;letter-spacing:-.03em}
.logo i{width:40px;height:40px;border-radius:11px;background:#fff;position:relative}
.logo i:after{content:'';position:absolute;right:-8px;top:-8px;width:18px;height:18px;border-radius:50%;background:#E8963A;border:4px solid #0F4C45}
.logo small{font-size:16px;letter-spacing:.3em;opacity:.7;font-weight:600;margin-left:4px}
h1{font-size:98px;line-height:1.08;letter-spacing:-.05em;margin:70px 0 0;font-weight:800}
h1 em{font-style:normal;color:#FFC98A}
p{font-size:28px;font-weight:600;opacity:.82;margin:34px 0 0;letter-spacing:-.02em}
</style></head><body><div class="b1"></div><div class="b2"></div><div class="in">
<div class="logo"><i></i>플랜듀<small>PLANDUE</small></div>
<h1>그 회사에 딱,<br><em>핏</em>을 맞추다.</h1>
<p>기업 · 공공기관 · 보험사 맞춤형 교육 — 강의 · 워크숍 · 연수</p>
</div></body></html>
